<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캐치 월드 - 번아웃 소각장</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b2f; color: #cfcfe6;
      font-family: system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #game { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    #game canvas { display: block; width: 100%; height: 100%; }
    #tooltip { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 999px;
      background: rgba(18, 18, 31, 0.8); color: #fff; font-size: 13px; white-space: nowrap;
      pointer-events: none; transform: translate(12px, 16px); opacity: 0; transition: opacity 0.15s; }
    #bubble { position: absolute; left: 0; top: 0; max-width: 260px; padding: 10px 14px; border-radius: 14px;
      background: #fff; color: #2a2a40; font-size: 15px; line-height: 1.4; text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); pointer-events: none;
      transform: translate(-50%, -100%); margin-top: -10px; opacity: 0; transition: opacity 0.2s; }
    #bubble::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -8px;
      border: 8px solid transparent; border-top-color: #fff; }
    #tooltip.visible, #bubble.visible { opacity: 1; }
    #prompt { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center;
      gap: 10px; padding: 8px 16px; border-radius: 999px; background: rgba(18, 18, 31, 0.8); color: #fff; font-size: 15px;
      white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
    #prompt.visible { opacity: 1; }
    .keycap { display: inline-block; min-width: 22px; padding: 2px 7px; border-radius: 6px; background: #fff; color: #1b1b2f;
      font-weight: 700; text-align: center; box-shadow: 0 2px 0 #9a9ab8; }
    #fortune { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(10, 10, 20, 0.65); z-index: 3; }
    #fortune.open { display: flex; }
    .fortune-stage { display: none; flex-direction: column; align-items: center; text-align: center; }
    #fortune[data-stage="cookie"] .fortune-cookie, #fortune[data-stage="cracking"] .fortune-cookie,
    #fortune[data-stage="card"] .fortune-card { display: flex; }
    .cookie { font-size: 110px; line-height: 1; padding: 0; border: 0; background: none; cursor: pointer; }
    #fortune[data-stage="cracking"] .cookie { animation: crack 0.4s ease-in-out forwards; }
    @keyframes crack {
      0% { transform: scale(1) rotate(0); } 20% { transform: scale(1.1) rotate(-12deg); }
      40% { transform: scale(1.15) rotate(10deg); } 60% { transform: scale(1.2) rotate(-8deg); }
      80% { transform: scale(1.3) rotate(6deg); } 100% { transform: scale(1.4) rotate(0); opacity: 0; }
    }
    .fortune-cookie p { margin: 14px 0 0; color: #fff; font-size: 17px; }
    .fortune-card { position: relative; width: min(420px, 80%); padding: 34px 28px 18px; border-radius: 6px;
      background: #fdf6e3; color: #3a2f1f; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .fortune-text { margin: 0; font-size: 19px; line-height: 1.6; word-break: keep-all; }
    .fortune-hint { margin: 16px 0 0; font-size: 12px; color: #8a7a5f; }
    .fortune-close { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 18px; color: #8a7a5f; cursor: pointer; }
    footer { font-size: 12px; text-align: center; padding: 6px 8px; background: #12121f; }
    #loading { position: fixed; inset: 0; background: rgba(18, 18, 31, 0.85); display: flex;
      align-items: center; justify-content: center; font-size: 20px; z-index: 5;
      transition: opacity 0.4s; animation: pulse 1.2s ease-in-out infinite alternate; }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; animation: none;
      transition: opacity 0.4s, visibility 0s 0.4s; }
    @keyframes pulse { from { color: #8a8aa8; } to { color: #ffffff; } }
    #mobile-notice { display: none; position: fixed; inset: 0; background: #1b1b2f;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; font-size: 18px; z-index: 10; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
    <footer>※ 학사 과제용 비공식 프로젝트입니다. '캐치(Catch)'와 무관하며 비상업적 목적으로만 제작되었습니다. 방문 통계(Google Analytics)를 수집합니다.</footer>
  </div>
  <div id="loading">불러오는 중…</div>
  <div id="mobile-notice">이 체험은 PC 브라우저(키보드·마우스)에서 이용해 주세요.</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
